name: PR Review Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install GitAgent CLI
        run: npm install -g @open-gitagent/gitagent

      - name: Validate GitAgent standard
        run: gitagent validate || echo "⚠️ Validation warning — continuing"

  review:
    runs-on: ubuntu-latest
    needs: validate-agent
    permissions:
      pull-requests: write
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-genai requests pyyaml

      - name: Run PR Review Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/pr_review.py
        
        # ── Post inline annotations (NEW) ─────────────────────────────────
      - name: Post inline code annotations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER:    ${{ github.event.pull_request.number }}
          HEAD_SHA:     ${{ github.event.pull_request.head.sha }}
          REPO_FULL_NAME: ${{ github.repository }}
        run: |
          python scripts/post_inline_comments.py
        continue-on-error: true   # never block the review if this fails

      # ── Slack notification (NEW) ───────────────────────────────────────
      - name: Send Slack notification
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PR_NUMBER:         ${{ github.event.pull_request.number }}
          PR_TITLE:          ${{ github.event.pull_request.title }}
          PR_URL:            ${{ github.event.pull_request.html_url }}
          PR_AUTHOR:         ${{ github.event.pull_request.user.login }}
          REPO_FULL_NAME:    ${{ github.repository }}
        run: |
          python scripts/notify.py --channel slack
        continue-on-error: true   # silently skip if SLACK_WEBHOOK_URL not set

      # ── Email notification (NEW) ───────────────────────────────────────
      - name: Send email notification
        if: always()
        env:
          SMTP_HOST:    ${{ secrets.SMTP_HOST }}
          SMTP_PORT:    ${{ secrets.SMTP_PORT }}
          SMTP_USER:    ${{ secrets.SMTP_USER }}
          SMTP_PASS:    ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          PR_NUMBER:    ${{ github.event.pull_request.number }}
          PR_TITLE:     ${{ github.event.pull_request.title }}
          PR_URL:       ${{ github.event.pull_request.html_url }}
          PR_AUTHOR:    ${{ github.event.pull_request.user.login }}
          REPO_FULL_NAME: ${{ github.repository }}
        run: |
          python scripts/notify.py --channel email
        continue-on-error: true   # silently skip if SMTP secrets not set